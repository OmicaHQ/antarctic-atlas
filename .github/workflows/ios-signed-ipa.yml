name: iOS Signed IPA

on:
  workflow_dispatch:

jobs:
  build-signed-ipa:
    name: Build Signed IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "${{ secrets.IOS_KEYCHAIN_PASSWORD }}" build.keychain

      - name: Install provisioning profile
        env:
          PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          security cms -D -i profile.mobileprovision > profile.plist
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' profile.plist)"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Archive signed app
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/AntarcticAtlas/AntarcticAtlas.xcodeproj \
            -scheme AntarcticAtlas \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/AntarcticAtlas.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            clean archive

      - name: Export signed IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/AntarcticAtlas.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist ios/AntarcticAtlas/ExportOptions.plist
          ls -lh build/export

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntarcticAtlas-signed-ipa
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true

name: macOS Apple Silicon

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package on macOS 15 arm64
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Create the pinned runtime
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements-desktop.txt -r requirements-dev.txt
          uv pip check --python .venv/bin/python

      - name: Run automated tests
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: .venv/bin/python -m pytest tests -q

      - name: Run source smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: .venv/bin/python scripts/macos-smoke.py

      - name: Build and verify the Apple Silicon archive
        run: scripts/build-macos.sh
